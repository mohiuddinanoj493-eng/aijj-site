<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>灯塔国再次点亮 · 2026 中期选举</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<style>
:root{--bg:#0a1424;--line:rgba(120,150,190,.22);--t:#e7eefc;--m:#8fa0bc;--g:#f6e2a0;--d:#6eb0ff;--r:#ff7d7d;--font:"PingFang SC","Microsoft YaHei",sans-serif;--mono:ui-monospace,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#15233a 0%,var(--bg) 55%);color:var(--t);font-family:var(--font);overflow:hidden}
.s{height:100%;max-width:1680px;margin:0 auto;padding:10px 14px 8px;display:grid;grid-template-rows:auto 1fr auto auto;gap:8px}
.top{display:grid;grid-template-columns:1.05fr .85fr 1.45fr;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:linear-gradient(180deg,#122038,#0c1728);min-height:86px}
.top>div{padding:10px 14px}.top>div+div{border-left:1px solid var(--line)}
.h1{font-size:clamp(22px,2.5vw,30px);font-weight:700;color:var(--g);letter-spacing:.06em}
.sub{margin-top:4px;font-size:12px;color:var(--m);letter-spacing:.12em}
.st{text-align:center;display:flex;flex-direction:column;justify-content:center}
.sl{font-size:11px;color:var(--m);letter-spacing:.18em}
.sb{margin-top:4px;font-size:clamp(20px,2.3vw,28px);font-weight:700;color:var(--g)}
.sm{margin-top:4px;font-size:11px;color:var(--m);font-family:var(--mono)}
.pv{display:grid;gap:4px;align-content:center}
.pv1{display:flex;justify-content:space-between;font-size:13px}
.pv1 .d{color:var(--d);font-weight:600}.pv1 .r{color:var(--r);font-weight:600}
.pv2{text-align:center;font-size:13px}.pv2 b{color:var(--d)}.pv2 b.x{color:var(--r)}
.bar{height:13px;border-radius:2px;overflow:hidden;background:linear-gradient(90deg,#1a4f9a,#8a3030);position:relative}
.bar>i{display:block;height:100%;width:50%;background:linear-gradient(90deg,#1e6fe0,#3d8be8);position:relative}
.bar>i:after{content:"";position:absolute;right:0;top:0;bottom:0;width:2px;background:#fff}
.pv3{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px}
.pv3 .d{color:var(--d)}.pv3 .r{color:var(--r)}
.main{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:4px;overflow:hidden;min-height:0;background:#0b1628}
.ch{padding:10px 12px 8px;display:grid;grid-template-rows:auto auto 1fr;gap:4px;min-height:0}
.ch+.ch{border-left:1px solid var(--line)}
.ct{font-size:16px;font-weight:700}.ct span{margin-left:8px;font-size:11px;color:var(--m);font-weight:500;letter-spacing:.12em}
.hd{display:flex;justify-content:space-between;gap:8px}
.cm{text-align:right;font-size:11px;color:var(--m);line-height:1.45}.cm b{color:var(--t)}
.cs{font-size:12px;color:var(--m);margin-top:2px}.cs b.d{color:var(--d)}.cs b.r{color:var(--r)}
.sc{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:6px;padding:2px 0 4px}
.n{font-size:clamp(48px,6vw,78px);font-weight:800;line-height:.88;font-variant-numeric:tabular-nums}
.n.d{color:#5aa7ff;text-shadow:0 0 28px rgba(90,167,255,.35)}.n.r{color:#ff6b6b;text-shadow:0 0 28px rgba(255,107,107,.3)}
.lab{font-size:13px;margin-top:2px;color:var(--m)}.lab b{color:var(--t)}
.vo{font-family:var(--mono);font-size:12px;color:var(--m);margin-top:2px}
.side.r{text-align:right}
.mid{align-self:center;font-size:12px;color:var(--m);border-left:1px solid var(--line);padding-left:10px;white-space:nowrap}
.mb{min-height:0;position:relative}.mb svg{width:100%;height:100%;display:block}
path.st{stroke:#0b1424;stroke-width:.9}
path.st.D{fill:#2f6fd0}path.st.R{fill:#c23d3d}path.st.T{fill:url(#hT)}path.st.S{fill:#2a3548}
.gov{border:1px solid var(--line);border-radius:4px;background:#0c1728;padding:8px 10px 10px}
.gh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px;font-size:14px}
.gh span,.gs{font-size:12px;color:var(--m)}.gs b.d{color:var(--d)}.gs b.r{color:var(--r)}
.gg{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));gap:4px}
.gt{border-radius:3px;padding:5px 4px;min-height:54px;display:flex;flex-direction:column;justify-content:space-between}
.gt.D{background:linear-gradient(160deg,#2a66c0,#1a3f7a)}.gt.R{background:linear-gradient(160deg,#b53a3a,#6e1f1f)}
.gt.T{background:repeating-linear-gradient(-45deg,#2f4568 0 5px,#7a6520 5px 10px)}.gt.S{background:#243044}
.gt .c{font-family:var(--mono);font-size:11px;font-weight:700}.gt .n{font-size:10px;opacity:.88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt .l{font-size:10px;font-weight:600}.gt .p{font-family:var(--mono);font-size:10px;opacity:.8}
.ft{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--m)}
.lg{display:flex;flex-wrap:wrap;gap:10px 14px}.lg i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-2px}
.lg .ld{background:#2f6fd0}.lg .lr{background:#c23d3d}.lg .lt{background:repeating-linear-gradient(-45deg,#2f4568 0 3px,#7a6520 3px 6px)}.lg .ls{background:#2a3548}
.rm{font-family:var(--mono);font-size:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:#3dffa8;display:inline-block;margin-right:5px;box-shadow:0 0 0 0 rgba(61,255,168,.5);animation:p 1.4s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(61,255,168,.55)}70%{box-shadow:0 0 0 10px rgba(61,255,168,0)}100%{box-shadow:0 0 0 0 rgba(61,255,168,0)}}
.btn{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--m);border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer;font-family:var(--font)}
.pill{border:1px solid rgba(61,255,168,.3);background:rgba(61,255,168,.08);color:#8dffc2;border-radius:999px;padding:3px 10px}
.tip{position:fixed;z-index:20;pointer-events:none;background:rgba(8,12,22,.96);border:1px solid var(--line);padding:8px 10px;border-radius:8px;font-size:12px;opacity:0;max-width:240px}
.tip.on{opacity:1}
@media(max-width:1100px){body{overflow:auto}.s{height:auto;min-height:100%}.gg{grid-template-columns:repeat(12,minmax(0,1fr))}.top{grid-template-columns:1fr}.top>div+div{border-left:0;border-top:1px solid var(--line)}}
@media(max-width:720px){.main{grid-template-columns:1fr}.ch+.ch{border-left:0;border-top:1px solid var(--line)}.gg{grid-template-columns:repeat(6,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="s">
<header class="top">
<div><div class="h1">灯塔国再次点亮</div><div class="sub">2026 美国中期选举　U.S. MIDTERM ELECTIONS</div></div>
<div class="st"><div class="sl">开票状态</div><div class="sb" id="sb">等待首批开票</div><div class="sm" id="sm">—</div></div>
<div class="pv">
<div class="pv1"><span class="d" id="pd">民主党 —</span><span class="r" id="pr">— 共和党</span></div>
<div class="pv2" id="pl">全国众院相关选票 · <b>—</b></div>
<div class="bar"><i id="pb"></i></div>
<div class="pv3"><span class="d" id="pvd">— 票</span><span class="r" id="pvr">— 票</span></div>
</div>
</header>
<section class="main">
<article class="ch">
<div class="hd"><div><div class="ct">众议院<span>HOUSE</span></div><div class="cs" id="hp">选前席位 —</div></div><div class="cm" id="hm">435 席 · 218 多数</div></div>
<div class="sc"><div class="side"><div class="n d" id="hd">—</div><div class="lab"><b>民主党</b> · 当前领先</div><div class="vo" id="hdv">—</div></div><div class="mid" id="hmd">—</div><div class="side r"><div class="n r" id="hr">—</div><div class="lab"><b>共和党</b> · 当前领先</div><div class="vo" id="hrv">—</div></div></div>
<div class="mb"><svg id="hmap" viewBox="0 0 975 610"></svg></div>
</article>
<article class="ch">
<div class="hd"><div><div class="ct">参议院<span>SENATE</span></div><div class="cs" id="sp">现有席位 —</div></div><div class="cm" id="sem">100 席 · 改选 35</div></div>
<div class="sc"><div class="side"><div class="n d" id="sd">—</div><div class="lab"><b>民主党</b> · 保留+本轮</div><div class="vo" id="sdv">—</div></div><div class="mid" id="smd">—</div><div class="side r"><div class="n r" id="sr">—</div><div class="lab"><b>共和党</b> · 保留+本轮</div><div class="vo" id="srv">—</div></div></div>
<div class="mb"><svg id="smap" viewBox="0 0 975 610"></svg></div>
</article>
</section>
<section class="gov">
<div class="gh"><div>州长选举<span> 36 州</span></div><div class="gs" id="gs">—</div><div class="gs" id="gp">—</div></div>
<div class="gg" id="gg"></div>
</section>
<footer class="ft">
<div class="lg"><span><i class="ld"></i>民主党</span><span><i class="lr"></i>共和党</span><span><i class="lt"></i>胶着</span><span><i class="ls"></i>暂无</span></div>
<div class="rm"><span class="pill" id="pill">官方同步</span><span><span class="dot"></span>LIVE</span><button class="btn" id="rf" type="button">立即刷新</button><span id="ft">civicAPI via sitmap</span></div>
</footer>
</div>
<div class="tip" id="tip"></div>
<script>
const API='https://sitmap.live/api/elections/us-2026.json';
const CN={AL:'阿拉巴马',AK:'阿拉斯加',AZ:'亚利桑那',AR:'阿肯色',CA:'加利福尼亚',CO:'科罗拉多',CT:'康涅狄格',DE:'特拉华',FL:'佛罗里达',GA:'佐治亚',HI:'夏威夷',ID:'爱达荷',IL:'伊利诺伊',IN:'印第安纳',IA:'艾奥瓦',KS:'堪萨斯',KY:'肯塔基',LA:'路易斯安那',ME:'缅因',MD:'马里兰',MA:'马萨诸塞',MI:'密歇根',MN:'明尼苏达',MS:'密西西比',MO:'密苏里',MT:'蒙大拿',NE:'内布拉斯加',NV:'内华达',NH:'新罕布什尔',NJ:'新泽西',NM:'新墨西哥',NY:'纽约',NC:'北卡',ND:'北达',OH:'俄亥俄',OK:'俄克拉荷马',OR:'俄勒冈',PA:'宾州',RI:'罗得岛',SC:'南卡',SD:'南达',TN:'田纳西',TX:'得州',UT:'犹他',VT:'佛蒙特',VA:'弗吉尼亚',WA:'华盛顿',WV:'西弗',WI:'威斯康星',WY:'怀俄明',DC:'特区'};
const F={1:'AL',2:'AK',4:'AZ',5:'AR',6:'CA',8:'CO',9:'CT',10:'DE',11:'DC',12:'FL',13:'GA',15:'HI',16:'ID',17:'IL',18:'IN',19:'IA',20:'KS',21:'KY',22:'LA',23:'ME',24:'MD',25:'MA',26:'MI',27:'MN',28:'MS',29:'MO',30:'MT',31:'NE',32:'NV',33:'NH',34:'NJ',35:'NM',36:'NY',37:'NC',38:'ND',39:'OH',40:'OK',41:'OR',42:'PA',44:'RI',45:'SC',46:'SD',47:'TN',48:'TX',49:'UT',50:'VT',51:'VA',53:'WA',54:'WV',55:'WI',56:'WY'};
const $=id=>document.getElementById(id);
const fmt=n=>(Math.round(n||0)).toLocaleString('en-US');
let feats=null, last=null;

function lean(c){
  const a=c.candidates||[];
  const w=a.find(x=>x.winner);
  if(w) return w.group==='dem'?'D':w.group==='rep'?'R':'S';
  if(c.call&&c.call.winners&&c.call.winners.length){
    const id=c.call.winners[0]; const ww=a.find(x=>x.id===id||String(x.id)===String(id));
    if(ww) return ww.group==='dem'?'D':ww.group==='rep'?'R':'S';
  }
  const t=a.slice().sort((x,y)=>(y.votes||0)-(x.votes||0));
  if(!t.length||!(t[0].votes>0)) return 'S';
  const A=t[0],B=t[1];
  if(A.group==='dem'||A.group==='rep'){
    if(B&&B.votes>0&&Math.abs((A.pct||0)-(B.pct||0))<1&&!A.winner) return 'T';
    return A.group==='dem'?'D':'R';
  }
  return 'S';
}
function houseLean(cs){
  const bag={}; cs.filter(c=>c.chamber==='house').forEach(c=>{
    const st=c.jurisdiction&&c.jurisdiction.state; if(!st)return;
    bag[st]=bag[st]||{D:0,R:0,T:0,S:0}; bag[st][lean(c)]++;
  });
  const m={}; Object.keys(bag).forEach(st=>{const o=bag[st];
    if(!o.D&&!o.R&&!o.T)m[st]='S'; else if(o.D===o.R)m[st]='T'; else m[st]=o.D>o.R?'D':'R';
  }); return m;
}
function senLean(cs){const m={}; cs.filter(c=>c.chamber==='senate').forEach(c=>{const st=c.jurisdiction&&c.jurisdiction.state; if(st)m[st]=lean(c)}); return m}
function tally(d,ch){return (d.tallies||[]).find(t=>t.chamber===ch)||{}}

function draw(svg, color, title){
  if(!feats) return;
  let defs=svg.querySelector('defs'); if(!defs){defs=document.createElementNS('http://www.w3.org/2000/svg','defs'); svg.prepend(defs);
    defs.innerHTML='<pattern id="hT" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(-45)"><rect width="6" height="6" fill="#2a4068"/><rect width="3" height="6" fill="#8a7020"/></pattern>';
  }
  let g=svg.querySelector('g.s');
  const path=d3.geoPath(d3.geoAlbersUsa().scale(1150).translate([488,305]));
  const tip=$('tip');
  if(!g){
    g=document.createElementNS('http://www.w3.org/2000/svg','g'); g.setAttribute('class','s'); svg.appendChild(g);
    feats.forEach(f=>{
      const st=F[Number(f.id)]||''; const d=path(f); if(!d)return;
      const p=document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('d',d); p.setAttribute('class','st S'); p.dataset.st=st;
      p.onpointerenter=()=>{const L=p.dataset.L||'S'; tip.innerHTML=`<b>${st} ${CN[st]||''}</b><br/>${title} · ${{D:'民主党',R:'共和党',T:'胶着',S:'暂无'}[L]}`; tip.classList.add('on')};
      p.onpointermove=e=>{tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY+14)+'px'};
      p.onpointerleave=()=>tip.classList.remove('on');
      g.appendChild(p);
    });
  }
  g.querySelectorAll('path.st').forEach(p=>{const L=color[p.dataset.st]||'S'; p.dataset.L=L; p.setAttribute('class','st '+L)});
}

function apply(d){
  last=d;
  const H=tally(d,'house'), S=tally(d,'senate'), G=tally(d,'governor');
  const cs=d.contests||[];
  let dv=0,rv=0,sdv=0,srv=0;
  cs.forEach(c=>(c.candidates||[]).forEach(x=>{
    const v=x.votes||0;
    if(c.chamber==='house'){if(x.group==='dem')dv+=v; else if(x.group==='rep')rv+=v}
    if(c.chamber==='senate'){if(x.group==='dem')sdv+=v; else if(x.group==='rep')srv+=v}
  }));
  const tot=dv+rv||1, dp=100*dv/tot;
  $('pd').textContent=`民主党 ${dp.toFixed(1)}%`;
  $('pr').textContent=`${(100-dp).toFixed(1)}% 共和党`;
  $('pb').style.width=dp.toFixed(2)+'%';
  $('pvd').textContent=fmt(dv)+' 票'; $('pvr').textContent=fmt(rv)+' 票';
  const lead=Math.abs(dv-rv), dem=dv>=rv;
  $('pl').innerHTML=`全国众院相关选票 · <b class="${dem?'':'x'}">${dem?'民主党领先':'共和党领先'} ${fmt(lead)} 票</b>`;

  const hD=(H.won&&H.won.dem||0)+(H.leading&&H.leading.dem||0);
  const hR=(H.won&&H.won.rep||0)+(H.leading&&H.leading.rep||0);
  const hO=H.open||Math.max(0,435-hD-hR);
  $('hd').textContent=hD; $('hr').textContent=hR;
  $('hdv').textContent=fmt(dv)+' 票'; $('hrv').textContent=fmt(rv)+' 票';
  $('hmd').textContent=hO?`其他 ${hO} 席　待定`:'全数已有结果';
  $('hp').innerHTML=`选前席位　民主党 <b class="d">215</b>　共和党 <b class="r">220</b>`;
  $('hm').innerHTML=`435 席 · 218 多数<br/>已计入 <b>${H.reporting||'—'}</b>/435<br/>已投影 <b>${H.called||0}</b>`;

  const sD=S.control&&S.control.dem!=null?S.control.dem:((S.decided&&S.decided.dem||0)+(S.decided&&S.decided.ind||0));
  const sR=S.control&&S.control.rep!=null?S.control.rep:(S.decided&&S.decided.rep||0);
  $('sd').textContent=sD; $('sr').textContent=sR;
  $('sdv').textContent=fmt(sdv)+' 票'; $('srv').textContent=fmt(srv)+' 票';
  $('smd').textContent=(S.open||0)?`其他 ${S.open} 席　待定`:'参院格局已定';
  $('sp').innerHTML=`现有席位　民主党 <b class="d">45</b>　共和党 <b class="r">53</b>　独立 <b>2</b>`;
  $('sem').innerHTML=`100 席 · 改选 35<br/>已计入 <b>${S.reporting||35}</b>/35<br/>已投影 <b>${S.called||0}</b>`;

  const st=d.dataState||'counting';
  let txt={counting:'开票倒计时',live:'实时开票中',called:'关键结果已投影',final:'接近终局',prerace:'等待首批开票'}[st]||'开票倒计时';
  if(!(H.reporting||0) && !dv) txt='等待首批开票';
  $('sb').textContent=txt;

  draw($('hmap'), houseLean(cs), '众院');
  draw($('smap'), senLean(cs), '参院');

  const govs=[], seen=new Set();
  cs.filter(c=>c.chamber==='governor').forEach(c=>{
    const st=c.jurisdiction&&c.jurisdiction.state;
    if(!st||st.length!==2||seen.has(st)||(c.jurisdiction&&c.jurisdiction.territory)||!CN[st]) return;
    seen.add(st);
    const tops=(c.candidates||[]).slice().sort((a,b)=>(b.votes||0)-(a.votes||0));
    const a=tops[0], L=lean(c), called=!!(a&&a.winner)||!!(c.call&&c.call.winners&&c.call.winners.length);
    govs.push({st,L,a,called,rpt:c.reportingPct});
  });
  govs.sort((a,b)=>a.st.localeCompare(b.st));
  let gD=0,gR=0,gO=0; const gg=$('gg'); gg.innerHTML='';
  govs.forEach(g=>{
    if(g.L==='D')gD++; else if(g.L==='R')gR++; else gO++;
    const lead=g.a?(g.a.group==='dem'?'民主党':g.a.group==='rep'?'共和党':'其他'):'';
    const lt=!(g.a&&g.a.votes>0)?'待开票':(lead+(g.called?'胜选':'领先'));
    const pct=g.a&&g.a.pct!=null?Number(g.a.pct).toFixed(1)+'%':(g.rpt!=null?'计票 '+g.rpt+'%':'—');
    const el=document.createElement('div'); el.className='gt '+(g.L||'S');
    el.innerHTML=`<div class="c">${g.st}</div><div class="n">${CN[g.st]||g.st}</div><div class="l">${lt}</div><div class="p">${pct}</div>`;
    gg.appendChild(el);
  });
  const holdD=G.holdover&&G.holdover.dem||0, holdR=G.holdover&&G.holdover.rep||0;
  $('gs').innerHTML=`领先/胜选　民主 <b class="d">${gD}</b>　共和 <b class="r">${gR}</b>　其他 <b>${gO}</b>`+((holdD||holdR)?`　｜　全国 民主 <b class="d">${(G.control&&G.control.dem)||(gD+holdD)}</b>　共和 <b class="r">${(G.control&&G.control.rep)||(gR+holdR)}</b>`:'');
  $('gp').textContent=`已计入 ${G.reporting||govs.length}/${G.contests||govs.length}　已投影 ${G.called||0}`;
  const gen=d.generatedAt||d.fetchedAt;
  $('ft').textContent=`官方源 civicAPI（各州州务卿）via sitmap · ${gen?new Date(gen).toISOString().replace('T',' ').slice(0,19)+'Z':'—'}`;
  $('pill').textContent='官方实时同步';
}

async function maps(){
  for(const u of ['https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json','https://unpkg.com/us-atlas@3/states-10m.json']){
    try{const r=await fetch(u); if(r.ok){const t=await r.json(); feats=topojson.feature(t,t.objects.states).features; return}}catch(e){}
  }
}
async function refresh(why){
  try{
    const r=await fetch(API+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    apply(await r.json());
    if(why==='manual') $('pill').textContent='已刷新官方数据';
  }catch(e){
    console.error(e);
    if(!last){ $('sb').textContent='等待首批开票'; $('pill').textContent='等待首批开票'; }
    else $('pill').textContent='同步中…稍后重试';
  }
}
function clock(){
  const n=new Date();
  const et=n.toLocaleString('zh-CN',{timeZone:'America/New_York',hour12:false});
  const bj=n.toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false});
  $('sm').textContent=`美东 ${et}　·　北京 ${bj}`;
}
$('rf').onclick=()=>refresh('manual');
(async()=>{
  await maps();
  await refresh('init');
  setInterval(()=>refresh('auto'),3000);
  setInterval(clock,1000); clock();
})();
